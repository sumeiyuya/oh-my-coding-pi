name: Bug 报告
description: 报告可复现的缺陷（不是安全漏洞；安全问题请走 Security → Report a vulnerability）
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量把下面填全——缺信息时最难定位的往往是“哪个版本、有没有装 pi”。
        **不要粘贴密钥、真实论文数据或未发表结果。**

  - type: input
    id: app-version
    attributes:
      label: 应用版本
      description: 设置页可见，或右键 oh my coding pi.exe → 属性 → 详细信息 → 文件版本
      placeholder: "0.4.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      description: winver 里看到的版本，例如 Windows 11 23H2 (22631)
      placeholder: "Windows 11 23H2"
    validations:
      required: true

  - type: dropdown
    id: pi
    attributes:
      label: 本机 pi 状态
      description: 命令行执行 `pi --version` 的结果
      options:
        - 已安装 0.86.1
        - 已安装其它版本（请在下面补充）
        - 未安装 / 不确定
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 出问题的模块
      options:
        - 对话 / 模型
        - 笔记本 / Python 内核
        - 笔记本 / R 内核
        - 权限审批 / 策略 / 授权
        - 审计 / 诊断包
        - 安装 / 升级 / 卸载
        - 设置 / 更新检查
        - 其它
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开应用开始，按顺序写；能贴命令就贴命令
      placeholder: |
        1. 打开工作区 ...
        2. 在对话里输入 ...
        3. 观察到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有报错请贴完整堆栈或界面提示
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断包
      description: 设置页 → 导出诊断包，把生成的 zip 拖到这里（内容已脱敏）
      placeholder: diagnostics-2026-11-12T....zip
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，没有重复
          required: true
        - label: 我确认这不是安全漏洞（安全问题走 Security → Report a vulnerability）
          required: true
